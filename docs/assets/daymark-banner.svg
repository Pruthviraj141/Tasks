<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090D"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0B0B10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#7C79F2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B88FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#5E5CE6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- Subtle Top Line Accent -->
  <line x1="100" y1="0" x2="1100" y2="0" stroke="#7C79F2" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Logo Mark -->
  <g transform="translate(600, 110)" filter="url(#shadow)">
    <!-- Outer Icon Shell -->
    <rect x="-38" y="-38" width="76" height="76" rx="22" fill="#181824" stroke="#2C2C3E" stroke-width="1.5"/>
    <!-- Inner Accent Pill / Sun Arc -->
    <circle cx="0" cy="0" r="16" fill="url(#accentGrad)"/>
    <circle cx="4" cy="-4" r="14" fill="#181824"/>
    <!-- Little Spark / Ray -->
    <circle cx="6" cy="-6" r="3" fill="#8B88FF"/>
  </g>

  <!-- Title: DAYMARK -->
  <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="6" fill="#F4F4F6" text-anchor="middle">
    DAYMARK
  </text>

  <!-- Tagline -->
  <text x="600" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="1" fill="#9D9DA8" text-anchor="middle">
    Speak your plans. <tspan fill="#F4F4F6" font-weight="600">Own your day.</tspan>
  </text>

  <!-- Key Capability Badges -->
  <g transform="translate(600, 335)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    <!-- Badge 1: Voice-to-Task -->
    <g transform="translate(-290, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#1A1A24" stroke="#2A2A38" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E2E8" text-anchor="middle">🎙️ Voice-First Tasks</text>
    </g>
    <!-- Badge 2: Groq GPT-OSS 20B -->
    <g transform="translate(-90, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1A1A24" stroke="#2A2A38" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E2E8" text-anchor="middle">⚡ Groq GPT-OSS 20B</text>
    </g>
    <!-- Badge 3: Offline-First SQLite -->
    <g transform="translate(100, 0)">
      <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1A1A24" stroke="#2A2A38" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E2E8" text-anchor="middle">🔒 Local SQLite Store</text>
    </g>
    <!-- Badge 4: Android Widget & Haptics -->
    <g transform="translate(295, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#1A1A24" stroke="#2A2A38" stroke-width="1"/>
      <text x="0" y="5" fill="#E2E2E8" text-anchor="middle">📱 Native Widget &amp; Pulse</text>
    </g>
  </g>
</svg>
