<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#FAF9F6" />
		<meta name="description" content="Daymark — A minimalist, elegant mobile-first task manager" />
		<title>Daymark</title>
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('daymark_theme');
					var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (saved === 'dark' || (!saved && prefersDark)) {
						document.documentElement.classList.add('dark');
						var meta = document.querySelector('meta[name="theme-color"]');
						if (meta) meta.setAttribute('content', '#0D0D10');
					}
				} catch (e) {}
			})();
		</script>
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
