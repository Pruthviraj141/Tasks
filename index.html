<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/jpeg" href="/daymark-logo.jpg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
		<meta name="theme-color" content="#F8F7F3" />
		<meta name="description" content="Mark Your Day — A minimalist, elegant mobile-first task manager" />
		<title>Mark Your Day</title>
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('daymark_theme');
					var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (saved === 'dark' || (!saved && prefersDark)) {
						document.documentElement.classList.add('dark');
						var meta = document.querySelector('meta[name="theme-color"]');
						if (meta) meta.setAttribute('content', '#0C0C0E');
					}
				} catch (e) {}
			})();
		</script>
	</head>

	<body>
		<div id="root">
			<style>
				.initial-splash {
					position: fixed;
					inset: 0;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: space-between;
					background-color: #F8F7F3;
					color: #18181B;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
					padding: 48px 24px 32px;
					user-select: none;
					transition: background-color 0.2s ease;
				}
				.dark .initial-splash {
					background-color: #0C0C0E;
					color: #F4F4F6;
				}
				.initial-splash-center {
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					flex: 1;
				}
				.initial-splash-logo-img {
					width: 72px;
					height: 72px;
					border-radius: 19px;
					box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
					margin-bottom: 18px;
					background-color: #0C0C0E;
				}
				.initial-splash-title {
					font-size: 22px;
					font-weight: 600;
					letter-spacing: -0.025em;
					margin: 0;
				}
				.initial-splash-credit {
					font-size: 11px;
					font-weight: 500;
					letter-spacing: 0.12em;
					text-transform: uppercase;
					color: #8E8C85;
					opacity: 0;
					animation: splashCreditFade 0.8s ease-out 0.2s forwards;
				}
				.dark .initial-splash-credit {
					color: #8E8C98;
				}
				@keyframes splashCreditFade {
					from {
						opacity: 0;
						transform: translateY(4px);
					}
					to {
						opacity: 0.75;
						transform: translateY(0);
					}
				}
			</style>
			<div class="initial-splash">
				<div class="initial-splash-center">
					<img src="/daymark-logo.jpg" alt="Mark Your Day" class="initial-splash-logo-img" />
					<h1 class="initial-splash-title">Mark Your Day</h1>
				</div>
				<div class="initial-splash-credit">
					Built by Pruthvi
				</div>
			</div>
		</div>
		<script type="module" src="/src/react-app/main.tsx"></script>
	</body>
</html>
